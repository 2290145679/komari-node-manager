server {
    listen __PORT__;
    server_name __SERVER_NAME__;

    client_max_body_size 50M;

    # Service Worker cleanup
    location = /registerSW.js {
        alias /opt/komari/web-patch/registerSW.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location = /sw.js {
        alias /opt/komari/web-patch/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Helper script for deployment & cache busting
    location = /assets/komari-singbox-helper.js {
        alias /opt/komari/web-patch/assets/komari-singbox-helper.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Patched frontend chunk (Server List & Modal)
    location = /assets/chunk-index-BfURcdSr.js {
        alias /opt/komari/web-patch/assets/chunk-index-BfURcdSr.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Patched frontend layout chunk (Sidebar Navigation)
    location = /assets/chunk-_layout-KM9Ke-Y5.js {
        alias /opt/komari/web-patch/assets/chunk-_layout-KM9Ke-Y5.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Patched frontend chunk (Admin Plugin Page)
    location = /assets/chunk-plugin_page-Xen4h3Tc.js {
        alias /opt/komari/web-patch/assets/chunk-plugin_page-Xen4h3Tc.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Static hashed assets caching (30 days for Vite immutable chunks)
    location /assets/ {
        proxy_pass http://127.0.0.1:25774;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Themes caching
    location /themes/ {
        proxy_pass http://127.0.0.1:25774;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Direct static serving for Node Manager panel (Zero caching)
    location /api/admin/plugin/node-manager/ {
        alias /opt/komari/data/plugin/node-manager/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location /api/plugin/node-manager/ {
        alias /opt/komari/data/plugin/node-manager/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Node Manager API
    location /api/node-mgr/ {
        proxy_pass http://127.0.0.1:25775/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subscription endpoint
    location /sub/ {
        proxy_pass http://127.0.0.1:25775/sub/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # One-click installer
    location = /install-node.sh {
        proxy_pass http://127.0.0.1:25775/install-node.sh;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Komari Web App
    location / {
        proxy_pass http://127.0.0.1:25774;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        sub_filter '</body>' '<script src="/assets/komari-singbox-helper.js?v=7"></script></body>';
        sub_filter_once on;
    }
}
